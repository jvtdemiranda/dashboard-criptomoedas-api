name: Atualizar dados

# Único workflow que de fato chama a API pública da CoinGecko. Roda de
# hora em hora sozinho (cron) e também pode ser disparado manualmente. Se
# a busca ou o commit derem certo, o push nesta branch aciona o deploy
# automático na Vercel — o painel sempre mostra a última execução que
# funcionou (não trava se a CoinGecko cair uma vez, só tenta de novo na
# próxima janela).
#
# Cron em ":17" de propósito, não ":00" — a documentação do GitHub avisa
# que workflows agendados pra "hora cheia" atrasam mais porque é o
# horário de maior carga dos runners compartilhados; um minuto
# excêntrico evita esse pico (bug real: o primeiro deploy deste projeto
# ficou mais de 15min sem a execução agendada disparar, por causa disso).

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# Evita duas execuções deste workflow publicando ao mesmo tempo — a
# primeira execução agendada de verdade (depois de ~6h de fila
# congestionada) disparou, publicou com sucesso, e o GitHub tentou de
# novo a MESMA execução (tentativa 2, com checkout antigo de quando ela
# foi originalmente enfileirada) — o push da tentativa 2 foi rejeitado
# porque a tentativa 1 já tinha publicado (ver bug real no README).
# cancel-in-progress: false pra enfileirar, não cancelar — cada execução
# ainda deve rodar e publicar seu próprio dado, só não em paralelo.
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  atualizar:
    name: Buscar dados novos e publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Buscar dados novos e montar o dashboard
        run: |
          set -e
          cd scripts
          python buscar_dados.py
          python gerar_dashboard_html.py

      - name: Commitar e publicar se algo mudou
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then
            echo "Nada mudou desde a última execução."
            exit 0
          fi
          git commit -m "Atualiza dados de mercado (automático)"

          # Retry com rebase: além do concurrency group, isso cobre o
          # caso de uma execução ter checkout desatualizado (ver
          # comentário no gatilho do workflow) — se o push for
          # rejeitado porque o remoto andou, sincroniza e tenta de novo
          # em vez de falhar a execução inteira.
          for tentativa in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejeitado (tentativa $tentativa/3) — outra execução deve ter publicado primeiro. Sincronizando..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Conflito ao sincronizar com origin/main — abortando"
              exit 1
            fi
          done
          echo "::error::Não foi possível publicar depois de 3 tentativas"
          exit 1
